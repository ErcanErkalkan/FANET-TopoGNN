# Base scientific environment; intentionally does not install PyTorch.
# Use requirements-deep.txt or pip install -e ".[deep]" for manuscript-facing
# neural GNN/temporal baselines.
name: fanet-topognn
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.25
  - pandas>=2.0
  - scipy>=1.11
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - pip
