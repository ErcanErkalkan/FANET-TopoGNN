[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fanet-topognn"
# Working-tree package version. The cited Zenodo DOI archives v0.1.0-q1-compact.
version = "0.1.12"
description = "Reproducibility suite for FANET-TopoGNN-style experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.25",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "simpy>=4.1",
]

[project.optional-dependencies]
deep = [
    "torch>=2.1",
]
explain = [
    "shap>=0.46",
]
pyg = [
    "torch>=2.1",
    "torch-geometric>=2.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fanet*"]
