[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fanet-topognn-q1"
version = "0.1.0"
description = "Reproducibility suite for FANET-TopoGNN-style experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.25",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
deep = [
    "torch>=2.1",
]
pyg = [
    "torch>=2.1",
    "torch-geometric>=2.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fanet_q1*"]
